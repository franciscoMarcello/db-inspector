<button
  class="app-btn"
  [ngClass]="buttonClasses"
  [attr.aria-label]="ariaLabel || null"
  [attr.type]="type"
  [disabled]="disabled"
  (click)="onClick($event)"
>
  <mat-icon *ngIf="icon && iconPosition === 'left'" class="app-btn__icon" [ngClass]="iconClasses">{{ icon }}</mat-icon>
  <span class="app-btn__label"><ng-content></ng-content></span>
  <mat-icon *ngIf="icon && iconPosition === 'right'" class="app-btn__icon" [ngClass]="iconClasses">{{ icon }}</mat-icon>
</button>
