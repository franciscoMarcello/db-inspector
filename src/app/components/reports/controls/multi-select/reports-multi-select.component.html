<div
  class="multi-select"
  [class.open]="open"
  [class.disabled]="disabled"
  [class.multi-select--single]="mode === 'single'"
  [class.multi-select--sm]="size === 'sm'"
>
  <button
    type="button"
    class="multi-select__trigger"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="panelId"
    [attr.aria-haspopup]="'listbox'"
    (keydown)="onTriggerKeydown($event)"
    (click)="toggleOpen()"
    [disabled]="disabled"
  >
    <span class="multi-select__label">{{ summaryLabel }}</span>
    <span class="multi-select__caret">{{ open ? '▴' : '▾' }}</span>
  </button>

  <div class="multi-select__panel" *ngIf="open" [id]="panelId" role="listbox" (click)="$event.stopPropagation()">
    <div class="multi-select__toolbar">
      <input
        type="text"
        class="multi-select__search"
        placeholder="Buscar..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchTermChange()"
        (keydown)="onSearchKeydown($event)"
        [ngModelOptions]="{ standalone: true }"
      />
      <button
        *ngIf="mode === 'multiple'"
        type="button"
        class="multi-select__action"
        (click)="selectAllFiltered()"
      >
        Todos
      </button>
      <button type="button" class="multi-select__action" (click)="clearSelection()">Limpar</button>
    </div>

    <div class="multi-select__list" *ngIf="!loading; else loadingTpl">
      <div class="multi-select__item" *ngFor="let opt of filteredOptions; let i = index" [class.is-highlighted]="highlightedIndex === i">
        <input
          *ngIf="mode === 'multiple'"
          type="checkbox"
          [checked]="isChecked(opt.value)"
          (click)="$event.stopPropagation()"
          (change)="toggleOption(opt.value, checkboxRef.checked)"
          #checkboxRef
        />
        <button
          type="button"
          class="multi-select__item-action"
          role="option"
          [attr.aria-selected]="isChecked(opt.value)"
          (keydown)="onOptionKeydown($event, i, opt.value)"
          (click)="toggleOptionByClick(opt.value, $event)"
        >
          {{ opt.label }}
        </button>
      </div>
      <div class="multi-select__empty" *ngIf="!filteredOptions.length">Sem opções</div>
    </div>
    <ng-template #loadingTpl>
      <div class="multi-select__empty">Carregando opções...</div>
    </ng-template>
  </div>
</div>
