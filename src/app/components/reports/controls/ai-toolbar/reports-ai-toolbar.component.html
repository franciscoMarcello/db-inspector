@if (isAdmin()) {
  <div
    class="flex flex-wrap items-center justify-end gap-2"
    role="group"
    aria-label="Recursos de IA"
  >
    <!-- Sempre visivel para admin: com zero pendentes ainda da para consultar o historico. -->
    <app-button
      type="button"
      [tone]="pendingCount() > 0 ? 'primary' : 'neutral'"
      [variant]="pendingCount() > 0 ? 'solid' : 'outline'"
      size="sm"
      [ariaLabel]="
        pendingCount() > 0
          ? 'Pedidos da IA: ' + pendingCount() + ' aguardando decisão'
          : 'Pedidos da IA: nenhum aguardando decisão'
      "
      (pressed)="openApprovals()"
    >
      {{ pendingCount() > 0 ? 'Pedidos da IA (' + pendingCount() + ')' : 'Pedidos da IA' }}
    </app-button>
    <app-button
      type="button"
      tone="neutral"
      variant="outline"
      size="sm"
      (pressed)="manualOpen.set(true)"
    >
      Manual
    </app-button>
    <app-button
      type="button"
      tone="neutral"
      variant="outline"
      size="sm"
      (pressed)="tokensOpen.set(true)"
    >
      Tokens para IA
    </app-button>
    <app-button
      type="button"
      tone="neutral"
      variant="outline"
      size="sm"
      (pressed)="downloadPackage()"
      [disabled]="downloadingPackage()"
    >
      {{ downloadingPackage() ? 'Baixando...' : 'Instruções para IA' }}
    </app-button>
  </div>

  <!-- Modais carregados sob demanda: so entram no bundle quando abertos pela primeira vez. -->
  @defer (when manualOpen()) {
    <app-reports-ai-manual-modal
      [open]="manualOpen()"
      (close)="manualOpen.set(false)"
      (openTokens)="openTokensFromManual()"
    ></app-reports-ai-manual-modal>
  }
  @defer (when tokensOpen()) {
    <app-reports-ai-tokens-modal
      [open]="tokensOpen()"
      (close)="tokensOpen.set(false)"
    ></app-reports-ai-tokens-modal>
  }
  @defer (when approvalsOpen()) {
    <app-reports-ai-approvals-modal
      [open]="approvalsOpen()"
      (close)="closeApprovals()"
      (changed)="refreshPendingCount()"
    ></app-reports-ai-approvals-modal>
  }
}
